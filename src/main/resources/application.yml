# 默认配置：内置 H2（MySQL 兼容模式），开箱即跑，无需任何外部依赖
spring:
  application:
    name: ddd-scaffold
  datasource:
    url: jdbc:h2:mem:ddd_scaffold;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # 数据库结构版本化：启动时自动执行 classpath:db/migration 下的迁移（H2 与 MySQL 同一套脚本）
  flyway:
    enabled: true
    # 对已存在历史库首次接入时允许以 baseline 起跑，避免启动即失败
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.biz.infrastructure.repository: debug

server:
  port: 8081
